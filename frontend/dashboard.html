<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptitude Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    color:white;
}

.overlay{
    background:rgba(0,0,0,0.55);
    min-height:100vh;
    padding:20px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:15px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#fff;
}

.menu a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
    transition:0.3s;
}

.menu a:hover{
    color:#ffd369;
}

.hero{
    text-align:center;
    margin-top:60px;
}

.hero h1{
    font-size:55px;
    margin-bottom:15px;
}

.hero p{
    font-size:20px;
    opacity:0.9;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-around;
    margin-top:50px;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h2{
    font-size:22px;
    margin-bottom:10px;
}

.card p{
    font-size:35px;
    font-weight:bold;
}

.chart-box{
    margin-top:50px;
    background:rgba(255,255,255,0.12);
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

.buttons{
    margin-top:40px;
    text-align:center;
}

.buttons a{
    text-decoration:none;
}

.buttons button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#ff9800,#ff5722);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.buttons button:hover{
    transform:scale(1.05);
}

</style>
</head>

<body>

<div class="overlay">

<nav>
    <div class="logo">🧠 Aptitude Platform</div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="add-question.html">Add Question</a>
        <a href="view-question.html">View Questions</a>
        <a href="quiz.html">Quiz</a>
    </div>
</nav>

<div class="hero">
    <h1>Welcome to Aptitude & Reasoning Platform</h1>
    <p>Practice, Analyze and Improve Your Skills</p>
</div>

<div class="cards">

    <div class="card">
        <h2>Total Questions</h2>
        <p>150+</p>
    </div>

    <div class="card">
        <h2>Topics</h2>
        <p>12</p>
    </div>

    <div class="card">
        <h2>Difficulty Levels</h2>
        <p>Easy/Medium/Hard</p>
    </div>

    <div class="card">
        <h2>Students</h2>
        <p>--</p>
    </div>

</div>

<div class="chart-box">
    <canvas id="myChart"></canvas>
</div>

<div class="buttons">
    <a href="add-question.html">
        <button>Add Questions</button>
    </a>

    <a href="view-question.html">
        <button>View Questions</button>
    </a>

    <a href="quiz.html">
        <button>Start Quiz</button>
    </a>
</div>

</div>

<script>
const ctx = document.getElementById('myChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Easy', 'Medium', 'Hard'],
        datasets: [{
            label: 'Questions',
            data: [50, 70, 30],
            borderWidth: 1
        }]
    },
    options: {
        responsive:true
    }
});
</script>

</body>
</html>
