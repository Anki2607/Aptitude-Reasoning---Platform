<body>
<h2>🧠 Aptitude Quiz</h2>

<div class="container">

<select id="topic">
  <option>Math</option>
  <option>Reasoning</option>
</select>

<select id="difficulty">
  <option>Easy</option>
  <option>Medium</option>
  <option>Hard</option>
</select>

<button onclick="startQuiz()">Start Quiz</button>

<div class="timer" id="timer"></div>

<div id="quiz"></div>

<div class="result" id="result"></div>

</div>

<script>

let questions = [];
let timeLeft = 60;
let timerInterval;

// 🚫 SCREEN LOCK
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    alert("⚠️ Cheating detected!");
  }
});

function startQuiz(){

  document.getElementById("result").innerHTML = "";

  const topic = document.getElementById("topic").value;
  const difficulty = document.getElementById("difficulty").value;

  fetch(`http://localhost:3001/questions?topic=${topic}&difficulty=${difficulty}`)
  .then(res => res.json())
  .then(data => {

    if(data.length === 0){
      document.getElementById("quiz").innerHTML = "<p>No questions available</p>";
      return;
    }

    questions = data;

    let html = "";

    data.forEach((q,i)=>{
      html += `
        <div class="card">
          <b>Q${i+1}. ${q.question}</b><br><br>

          <label class="option">
            <input type="radio" name="q${i}" value="A"> ${q.optionA}
          </label><br>

          <label class="option">
            <input type="radio" name="q${i}" value="B"> ${q.optionB}
          </label><br>

          <label class="option">
            <input type="radio" name="q${i}" value="C"> ${q.optionC}
          </label><br>

          <label class="option">
            <input type="radio" name="q${i}" value="D"> ${q.optionD}
          </label>
        </div>
      `;
    });

    html += `<button onclick="submitQuiz('${topic}','${difficulty}')">Submit Quiz</button>`;

    document.getElementById("quiz").innerHTML = html;

    startTimer(topic, difficulty);
  });
}

// ⏱️ TIMER
function startTimer(topic, difficulty){
  timeLeft = 60;
  document.getElementById("timer").innerHTML = "⏱️ Time: " + timeLeft + "s";

  clearInterval(timerInterval);

  timerInterval = setInterval(()=>{
    timeLeft--;
    document.getElementById("timer").innerHTML = "⏱️ Time: " + timeLeft + "s";

    if(timeLeft <= 0){
      clearInterval(timerInterval);
      submitQuiz(topic, difficulty);
    }
  },1000);
}

// 📊 SUBMIT QUIZ
function submitQuiz(topic,difficulty){

  clearInterval(timerInterval);

  let score = 0;

  questions.forEach((q,i)=>{
    const ans = document.querySelector(`input[name="q${i}"]:checked`);
    if(ans && ans.value === q.correct_ans){
      score++;
    }
  });

  const user = JSON.parse(localStorage.getItem("user"));

  fetch("http://localhost:3001/save-score",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user_id:user.user_id,
      score,
      topic,
      difficulty
    })
  });

  document.getElementById("result").innerHTML =
    `🎉 Your Score: ${score} / ${questions.length}`;

  document.getElementById("quiz").innerHTML = "";
}

</script>

</body>

    <script>
        const config = JSON.parse(localStorage.getItem("quiz_config"));
        const user = JSON.parse(localStorage.getItem("user"));

        let questions = [];
        let timeLeft = 600; // 10 minutes
        let timerInterval;

        if (!config || !user) {
            window.location.href = "dashboard.html";
        }

        async function loadQuiz() {
            document.getElementById("quizMeta").innerText = `${config.topic} | Level: ${config.difficulty}`;

            try {
                const res = await fetch(`http://localhost:3001/questions?topic=${encodeURIComponent(config.topic)}&difficulty=${config.difficulty}`);
                const data = await res.json();

                if (data.length === 0) {
                    document.getElementById("quiz").innerHTML = "<p style='text-align:center;'>No questions available for this selection.</p>";
                    document.getElementById("timer").innerHTML = "";
                    return;
                }

                // Shuffle and pick 5
                questions = data.sort(() => 0.5 - Math.random()).slice(0, 5);

                let html = "";
                questions.forEach((q, i) => {
                    html += `
                    <div class="card">
                        <b>Q${i + 1}. ${q.question}</b><br><br>
                        <label class="option"><input type="radio" name="q${i}" value="A"> ${q.optionA}</label>
                        <label class="option"><input type="radio" name="q${i}" value="B"> ${q.optionB}</label>
                        <label class="option"><input type="radio" name="q${i}" value="C"> ${q.optionC}</label>
                        <label class="option"><input type="radio" name="q${i}" value="D"> ${q.optionD}</label>
                    </div>
                `;
                });

                html += `<button class="submit-btn" onclick="submitQuiz()">Submit Quiz</button>`;
                document.getElementById("quiz").innerHTML = html;
                startTimer();
            } catch (err) {
                console.error(err);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById("timer").innerHTML = `⏱️ Time Left: ${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time Up!");
                    submitQuiz();
                }
            }, 1000);
        }

        async function submitQuiz() {
            clearInterval(timerInterval);
            let score = 0;

            questions.forEach((q, i) => {
                const ans = document.querySelector(`input[name="q${i}"]:checked`);
                if (ans && ans.value === q.correct_ans) {
                    score++;
                }
            });

            // Save Score
            try {
                await fetch("http://localhost:3001/save-score", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: user.id,
                        score: score,
                        topic: config.topic,
                        difficulty: config.difficulty
                    })
                });
            } catch (err) {
                console.error("Score saving failed", err);
            }

            document.getElementById("quiz").innerHTML = "";
            document.getElementById("timer").innerHTML = "";
            document.getElementById("resultArea").style.display = "block";
            document.getElementById("result").innerHTML = `🎉 Your Score: ${score} / ${questions.length}`;
        }

        loadQuiz();

        // Anti-Cheating
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && questions.length > 0) {
                alert("⚠️ Cheating detected! Don't switch tabs.");
            }
        });
    </script>
