<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aptitude & Reasoning Platform</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
      min-height: 100vh;
    }

    .container {
      margin-top: 150px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin: 10px;
      font-size: 16px;
      border-radius: 25px;
      text-decoration: none;
      color: white;
      background: #000;
      transition: 0.3s;
    }

    .btn:hover {
      background: #333;
      transform: scale(1.1);
    }

    .card {
      background: white;
      color: black;
      padding: 20px;
      border-radius: 15px;
      width: 300px;
      margin: auto;
      margin-top: 30px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🚀 Aptitude & Reasoning Platform</h1>
  <p>Practice smarter, track progress, and improve your skills</p>

  <a href="user/login.html" class="btn">Student Login</a>
  <a href="user/register.html" class="btn" style="background: #2ecc71;">Register</a>
  <a href="admin/login.html" class="btn" style="background: #6366f1;">Admin Login</a>

  <div class="card">
    <h3>✨ Features</h3>
    <p>✔ Topic-wise Quiz</p>
    <p>✔ Difficulty Levels</p>
    <p>✔ Progress Tracking</p>
  </div>
</div>

</body>
</html>
