<!DOCTYPE html>
<html>
<head>
  <title>Aptitude Platform</title>

  <style>
   body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    color:white;
}
    .container {
       background:rgba(255,255,255,0.12);
    border-radius:20px;
    color:white;
    width:60%;
    max-width:900px;
    padding:30px;
    margin:50px auto;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
.btn{
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      background: #4868ae;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4d5f89;
    }
  
    .card {
   background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    color:white;
    width:40%;
    max-width:900px;
    padding:30px;
    margin:50px auto;

    }
  </style>
</head>

<body>

<div class="container">
  <h1>🚀 Aptitude & Reasoning Platform</h1>
  <p>Practice smarter, track progress, and improve your skills</p>

  <a href="login.html" class="btn">Login</a>
  <a href="register.html" class="btn">Register</a>

  <div class="card">
    <h3>✨ Features</h3>
    <p>✔ Topic-wise Quiz</p>
    <p>✔ Difficulty Levels</p>
    <p>✔ Progress Tracking</p>
    <p>✔ Admin Panel</p>
  </div>
</div>
</body>
</html>
