<!DOCTYPE html>
<html>
<head>
  <title>View Questions</title>

  <style>
   body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    color:white;
}

    h2 {
      color: white;
      margin-top: 20px;
    }

    .container {
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    color:white;
    width:50%;
    max-width:900px;
    padding:30px;
    margin:50px auto;
}

    .filter-bar {
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 10px;
      width: 80%;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    select {
      padding: 10px;
      border-radius: 5px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .filter-btn {
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 0;
    }

    .filter-btn:hover {
      background: #45a049;
    }

    .card {
     background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    color:white;
    width:80%;
    max-width:900px;
    padding:30px;
    margin:50px auto;
}

    .question {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .options {
      margin-left: 10px;
      color: #555;
    }

    button {
      margin-top: 10px;
      padding: 8px 15px;
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }
  </style>
</head>

<body>

<h2>📋 Question List (Admin Panel)</h2>

<div class="filter-bar">
  <select id="topicFilter">
    <option value="">All Topics</option>
    <option value="Problems of Train">Problems of Train</option>
    <option value="Time and Distance">Time and Distance</option>
    <option value="Height and Distance">Height and Distance</option>
    <option value="Time and Work">Time and Work</option>
    <option value="Logical Reasoning">Logical Reasoning</option>
    <option value="Number Series">Number Series</option>
  </select>

  <select id="difficultyFilter">
    <option value="">All Difficulties</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>

  <button class="filter-btn" onclick="fetchQuestions()">Filter</button>
</div>

<div class="container" id="data"></div>

<script>
function fetchQuestions() {
  const topic = document.getElementById("topicFilter").value;
  const difficulty = document.getElementById("difficultyFilter").value;
  
  let url = "http://localhost:3001/questions?";
  if (topic) url += `topic=${encodeURIComponent(topic)}&`;
  if (difficulty) url += `difficulty=${encodeURIComponent(difficulty)}`;

  fetch(url)
  .then(res => res.json())
  .then(data => {
    let html = "";

    if (data.length === 0) {
      html = "<div class='card' style='text-align: center; color: #555;'>No questions found.</div>";
    } else {
      data.forEach((q, index) => {
        html += `
          <div class="card">
            <div class="question">Q${index+1} [${q.topic} - ${q.difficulty}]: ${q.question}</div>
            
            <div class="options">
              A. ${q.optionA}<br>
              B. ${q.optionB}<br>
              C. ${q.optionC}<br>
              D. ${q.optionD}<br>
              <b>Correct Answer:</b> ${q.correct_ans}
            </div>

            <button onclick="del(${q.q_id})">Delete</button>
          </div>
        `;
      });
    }

    document.getElementById("data").innerHTML = html;
  });
}

// Fetch all questions on load
fetchQuestions();

function del(id){
  if(confirm("Are you sure you want to delete this question?")){
    fetch("http://localhost:3001/delete/" + id, { method: "DELETE" })
    .then(() => fetchQuestions());
  }
}
</script>

</body>
</html>
