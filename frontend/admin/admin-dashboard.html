<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptitude Dashboard | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:
    linear-gradient(rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)),
    url("../background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    min-height:100vh;
    color:white;
}
.overlay{
    background:rgba(0,0,0,0.55);
    min-height:100vh;
    padding:20px;
}
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:15px;
}
.logo{
    font-size:28px;
    font-weight:bold;
    color:#fff;
}
.menu a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
    transition:0.3s;
    cursor: pointer;
}
.menu a:hover{
    color:#ffd369;
}
.hero{
    text-align:center;
    margin-top:60px;
}
.hero h1{
    font-size:55px;
    margin-bottom:15px;
}
.hero p{
    font-size:20px;
    opacity:0.9;
}
.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-around;
    margin-top:50px;
}
.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    transition:0.3s;
    text-align: center;
}
.card:hover{
    transform:translateY(-10px);
}
.card h2{
    font-size:22px;
    margin-bottom:10px;
}
.card p{
    font-size:35px;
    font-weight:bold;
}
.chart-box{
    margin-top:50px;
    background:rgba(255,255,255,0.12);
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}
.buttons{
    margin-top:40px;
    text-align:center;
}
.buttons a{
    text-decoration:none;
}
.buttons button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#ff9800,#ff5722);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}
.buttons button:hover{
    transform:scale(1.05);
}
.logout-btn {
    background: #ff4444 !important;
    padding: 10px 20px !important;
    border-radius: 8px !important;
    color: white !important;
}
</style>
</head>
<body>
<script>
    if (!localStorage.getItem("admin")) {
        window.location.href = "login.html";
    }
</script>
<div class="overlay">
<nav>
    <div class="logo">🧠 Aptitude Admin</div>
    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="add-question.html">Add Question</a>
        <a href="view-question.html">View Questions</a>
        <a onclick="logout()" class="logout-btn">Logout</a>
    </div>
</nav>
<div class="hero">
    <h1 id="adminName">Welcome to Admin Panel</h1>
    <p>Manage Questions, Analyze Data and Monitor Progress</p>
</div>
<div class="cards">
    <div class="card">
        <h2>Total Questions</h2>
        <p id="qCount">180+</p>
    </div>
    <div class="card">
        <h2>Topics</h2>
        <p>6</p>
    </div>
    <div class="card">
        <h2>Difficulty Levels</h2>
        <p>3</p>
    </div>
</div>
<div class="chart-box">
    <canvas id="myChart"></canvas>
</div>
<div class="buttons">
    <a href="add-question.html">
        <button>Add Questions</button>
    </a>
    <a href="manage-questions.html">
        <button>Manage Questions</button>
    </a>
    <a href="view-question.html">
        <button>View Questions</button>
    </a>
</div>
</div>
<script>
const admin = JSON.parse(localStorage.getItem("admin"));
if (admin) {
    document.getElementById("adminName").innerText = `Welcome, ${admin.name}`;
}
function logout() {
    localStorage.removeItem("admin");
    window.location.href = "login.html";
}
const ctx = document.getElementById('myChart');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Easy', 'Medium', 'Hard'],
        datasets: [{
            label: 'Questions Distribution',
            data: [61, 60, 60],
            backgroundColor: ['rgba(75, 192, 192, 0.6)', 'rgba(255, 206, 86, 0.6)', 'rgba(255, 99, 132, 0.6)'],
            borderWidth: 1
        }]
    },
    options: {
        responsive:true,
        scales: {
            y: { beginAtZero: true }
        }
    }
});
</script>
</body>
</html>
