<!DOCTYPE html>
<html>
<head>
  <script>
    (function() {
      const originalFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === 'string' && url.includes('localhost:3001')) {
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
          if (!isLocal) {
            url = url.replace(/https?:\/\/localhost:3001/i, '');
          }
        }
        return originalFetch(url, options);
      };
    })();
  </script>
  <title>View Questions</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url("../background.jpg") no-repeat center center fixed;
      background-size: cover;
      text-align: center;
    }

    h2 {
      color: white;
      margin-top: 20px;
    }

    .container {
      width: 80%;
      margin: auto;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: left;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }

    .question {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .options {
      margin-left: 10px;
      color: #555;
    }

    button {
      margin-top: 10px;
      padding: 8px 15px;
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .back-btn:hover {
      background: #333;
    }
  </style>
</head>

<body>
  <script>
      if (!localStorage.getItem("admin")) {
          window.location.href = "login.html";
      }
  </script>

<h2>📋 Question List (Admin Panel)</h2>

<a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

<div class="container" id="data"></div>

<script>
fetch("https://aptitude-reasoning-platform.onrender.com/questions")
.then(res => res.json())
.then(data => {
  let html = "";

  data.forEach((q, index) => {
    html += `
      <div class="card">
        <div class="question">Q${index+1}: ${q.question}</div>
        
        <div class="options">
          A. ${q.optionA}<br>
          B. ${q.optionB}<br>
          C. ${q.optionC}<br>
          D. ${q.optionD}<br>
          <b>Correct Answer:</b> ${q.correct_ans}
        </div>

        <button onclick="del(${q.q_id})">Delete</button>
      </div>
    `;
  });

  document.getElementById("data").innerHTML = html;
});

function del(id){
  if(confirm("Are you sure you want to delete this question?")){
    fetch("https://aptitude-reasoning-platform.onrender.com/delete/" + id, { method: "DELETE" })
    .then(() => location.reload());
  }
}
</script>

</body>
</html>
